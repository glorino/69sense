<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | 69 Sense</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-page { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 2rem; }
        .error-code { font-family: 'Orbitron', sans-serif; font-size: 8rem; font-weight: 900; background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .error-msg { font-family: 'Playfair Display', serif; font-size: 1.8rem; margin: 1rem 0; }
        .error-desc { color: var(--gray); max-width: 400px; line-height: 1.7; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-msg">Page Not Found</h1>
        <p class="error-desc">The page you are looking for does not exist or has been moved.</p>
        <a href="index.html" class="btn-primary"><span>Back to Home</span></a>
    </div>
</body>
</html>
